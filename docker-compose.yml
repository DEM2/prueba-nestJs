
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleetcore_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: npm run start:dev
    networks:
      - fleetcore_network

  postgres:
    image: postgres:15-alpine
    container_name: fleetcore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5435:5432"
    volumes:
      - fleetcore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fleetcore_network

volumes:
  fleetcore_data:

networks:
  fleetcore_network:
    driver: bridge
